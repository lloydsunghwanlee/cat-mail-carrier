# GitHub Pages 는 저장소 설정(Settings → Pages → Deploy from a branch: main / root)으로 배포됩니다.
# 이 워크플로는 푸시할 때마다 게임과 API가 정상인지 자동 점검만 합니다.
name: 자동 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
