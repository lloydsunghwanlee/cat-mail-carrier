# Render 블루프린트: 저장소를 연결하면 게임 + API 서버가 한 주소로 올라갑니다.
services:
  - type: web
    name: cat-mail-carrier
    runtime: docker
    plan: free           # 무료: 15분간 접속이 없으면 잠들고, 그때 랭킹이 지워집니다.
    # 랭킹을 보존하려면 plan: starter 로 바꾸고 아래 주석을 푸세요 (유료).
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: RUN_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://lloydsunghwanlee.github.io"
